// Forge before Mixin: a server-side recipe plus crafting hooks, built with
// Unimined because ForgeGradle for these versions needs a Gradle from 2014.
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream
import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.commons.ClassRemapper
import org.objectweb.asm.commons.SimpleRemapper

plugins {
    id 'xyz.wagyourtail.unimined' version '1.4.1' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'xyz.wagyourtail.unimined'

    def mc = property('minecraft_version') as String
    def javaRelease = (property('java_release') as String).toInteger()
    def gameVersions = (property('game_versions') as String).split(',')
    def label = gameVersions.size() == 1 ? gameVersions[0] : "${gameVersions.first()}-${gameVersions.last()}"
    version = "${rootProject.mod_version}+forge-mc${label}"
    group = 'org.tyfur.upgradablegaps'
    base.archivesName = 'upgradable-gaps'

    repositories {
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        mavenCentral()
    }

    java {
        // JDK 17 still compiles for Java 7, which the ASM in 1.6.4 and older Forge needs.
        toolchain.languageVersion = JavaLanguageVersion.of(javaRelease < 8 ? 17 : 21)
    }

    unimined.minecraft {
        version mc
        mappings {
            if (project.hasProperty('mcp_version')) {
                searge()
                mcp(property('mcp_channel') as String, property('mcp_version') as String)
            } else {
                // Forge 1.5.2 and older ship their own MCP names.
                forgeBuiltinMCP(property('forge_version') as String)
            }
        }
        minecraftForge {
            loader property('forge_version') as String
        }
    }

    sourceSets.main {
        java.srcDirs = ["${rootDir}/src/${property('era')}/java"]
        resources.srcDirs = ["${rootDir}/src/shared/resources"]
    }

    processResources {
        inputs.property 'version', version
        inputs.property 'mc', mc
        filesMatching(['mcmod.info', 'version.properties']) {
            expand version: version, mc: mc
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = javaRelease
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:-options'
    }

    jar {
        from(rootProject.file('../LICENSE'))
    }

    if (project.hasProperty('repackage')) {
        def forgeSrc = configurations.detachedConfiguration(
                dependencies.create("net.minecraftforge:forge:${mc}-${property('forge_version')}:src@zip"))
        // Forge 1.6 loads game classes by packaged names, but Unimined's searge
        // names for it still sit in net/minecraft/src.
        tasks.named('remapJar') {
            doLast {
                def packages = [:]
                zipTree(forgeSrc.singleFile).matching { include '**/fml/conf/packages.csv' }.singleFile.eachLine { line ->
                    def (cls, pkg) = line.split(',')
                    if (cls != 'class') {
                        packages["net/minecraft/src/${cls}".toString()] = "${pkg}/${cls}".toString()
                    }
                }
                def remapper = new SimpleRemapper(packages)
                def jarFile = archiveFile.get().asFile
                def tmp = new File("${jarFile}.tmp")
                new ZipFile(jarFile).withCloseable { zip ->
                    new ZipOutputStream(new FileOutputStream(tmp)).withCloseable { out ->
                        zip.entries().each { entry ->
                            byte[] bytes = zip.getInputStream(entry).bytes
                            if (entry.name.endsWith('.class')) {
                                def writer = new ClassWriter(0)
                                new ClassReader(bytes).accept(new ClassRemapper(writer, remapper), 0)
                                bytes = writer.toByteArray()
                            }
                            def copy = new ZipEntry(entry.name)
                            copy.time = entry.time
                            out.putNextEntry(copy)
                            out.write(bytes)
                            out.closeEntry()
                        }
                    }
                }
                jarFile.delete()
                tmp.renameTo(jarFile)
            }
        }
    }
}
