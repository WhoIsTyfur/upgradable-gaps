// Ornithe runs Fabric Loader on Minecraft 1.3.1-1.13.2 using its own
// intermediary (Calamus) and Feather mappings, supplied by Ploceus.
plugins {
    id 'fabric-loom' version '1.18.2' apply false
    id 'ploceus' version '1.18.1' apply false
}

subprojects {
    apply plugin: 'fabric-loom'
    apply plugin: 'ploceus'

    def gameVersions = (property('game_versions') as String).split(',')
    version = "${rootProject.mod_version}+ornithe-mc${gameVersions.first()}-${gameVersions.last()}"
    group = 'org.tyfur.upgradablegaps'
    base.archivesName = 'upgradable-gaps'

    dependencies {
        minecraft "com.mojang:minecraft:${property('minecraft_version')}"
        mappings ploceus.featherMappings(property('feather_build') as String)
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    }

    sourceSets.main {
        java.srcDirs = [
            "${rootDir}/src/upgrade/${property('upgrade')}/java",
            "${rootDir}/src/menu/${property('menu')}/java",
            "${rootDir}/src/slot/${property('slot')}/java",
        ]
        resources.srcDirs = ["${rootDir}/src/main/resources"]
    }

    def expanded = [version: version, minecraft_range: property('minecraft_range')]
    processResources {
        inputs.properties expanded
        filesMatching('fabric.mod.json') {
            expand expanded
        }
    }

    java {
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 8
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:-options'
    }

    tasks.withType(Jar).configureEach {
        from(rootProject.file('../LICENSE'))
    }
}
