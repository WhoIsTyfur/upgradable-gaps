name: Release

on:
  push:
    tags: ["v*"]
  # Re-runs a release with main's current scripts, e.g. after fixing publish.py.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches mod_version
        run: |
          # Forgive a typed tag's spaces, capital V or missing v.
          version="$(python3 -c 'import build; print(build.mod_version())')"
          typed="$(printf '%s' "$TAG" | tr -d '[:space:]')"
          if [ "${typed#[vV]}" != "$version" ]; then
            echo "::error::Tag '$TAG' does not match mod_version $version; use v$version"
            exit 1
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Build
        run: python3 build.py

      - name: Publish
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          HANGAR_API_KEY: ${{ secrets.HANGAR_API_KEY }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
        run: python3 publish.py

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(python3 -c "import publish; print(publish.changelog_for('${RELEASE_TAG#v}'))")"
          gh release create "$RELEASE_TAG" dist/*.jar --title "Upgradable Gaps ${RELEASE_TAG#v}" --notes "$notes"
