pluginManagement {
    repositories {
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'upgradable-gaps-forge-legacy'

// One subproject per Forge version; each folder's gradle.properties describes it.
file('targets').eachDir { dir ->
    include dir.name
    project(":${dir.name}").projectDir = dir
}
