pluginManagement {
    repositories {
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'upgradable-gaps'

// One subproject per loader + Minecraft range; each folder's gradle.properties describes it.
file('targets').eachDir { dir ->
    include dir.name
    project(":${dir.name}").projectDir = dir
}
