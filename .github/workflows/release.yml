name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches mod_version
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 -c 'import build; print(build.mod_version())')"

      - name: Build
        run: python3 build.py

      - name: Publish
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          BUKKITDEV_TOKEN: ${{ secrets.BUKKITDEV_TOKEN }}
          BUKKITDEV_PROJECT_ID: ${{ vars.BUKKITDEV_PROJECT_ID }}
          HANGAR_API_KEY: ${{ secrets.HANGAR_API_KEY }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
        run: python3 publish.py

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(python3 -c "import publish; print(publish.changelog_for('${GITHUB_REF_NAME#v}'))")"
          gh release create "$GITHUB_REF_NAME" dist/*.jar --title "Upgradable Gaps ${GITHUB_REF_NAME#v}" --notes "$notes"
